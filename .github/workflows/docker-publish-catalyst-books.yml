# Builds the STANDALONE catalyst-books image (Dockerfile.catalyst-books) — the books
# domain running in isolation (boom-zp2s). Separate GHCR package `catalyst-books`, so
# the boomtime ImageUpdater (which watches ghcr.io/<owner>/boomtime) never sees it.
# Same default-branch sha guard as docker-publish.yml.
name: docker-publish-catalyst-books

on:
  push:
    branches:
      - main
      - boom-domain-framework
    paths:
      # EVERY input Dockerfile.catalyst-books consumes must be listed here, or a
      # change to it ships nothing and the stale image keeps serving — and the
      # eventual break gets blamed on whatever unrelated commit finally
      # retriggers the build (boom-iadc). Two classes of input:
      #
      # 1. Go — stage 2 is `COPY . .` + `go build ./cmd/catalyst-books`. The
      #    real closure is `go list -deps ./cmd/catalyst-books`, which today is
      #    cmd/catalyst-books + internal/{books,jobs,shared}. internal/identity
      #    is listed defensively (it is one import away). CI enforces that this
      #    list still covers the live closure — see
      #    .github/scripts/validate-manifests.py, which fails if a new
      #    internal/* package enters the dep graph without landing here.
      - "cmd/catalyst-books/**"
      - "internal/books/**"
      - "internal/jobs/**"
      - "internal/shared/**"
      - "internal/identity/**"
      - "go.mod"
      - "go.sum"
      #
      # 2. Frontend — stage 1 builds the books SPA with `yarn build:books`,
      #    which runs `tsc -b` over the WHOLE tsconfig include before vite
      #    tree-shakes. So the shell (web/shared/books-main.tsx, index.css,
      #    index.books.html), the lockfile, the vite/tsconfig files, AND the
      #    boomtime-domain FE that tsc type-checks but the bundle discards are
      #    all build inputs. internal/books/web is already covered by
      #    internal/books/** above.
      - "web/**"
      - "internal/boomtime/web/**"
      - "internal/boomtime/widget/specs.json" # the @widget-specs alias target
      #
      - "Dockerfile.catalyst-books"
      - ".dockerignore" # gates what `COPY . .` actually lands in the builder
      - ".github/workflows/docker-publish-catalyst-books.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catalyst-books

jobs:
  # Same gate as docker-publish.yml — this workflow pushes unconditionally
  # (push: true), so without it a red commit ships the standalone books image
  # (boom-iadc).
  gate:
    uses: ./.github/workflows/quality-gates.yml

  build-and-push:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive VERSION for -X main.version
        id: version
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.catalyst-books
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
