---
# boomtime-worker: image-job execution, decoupled from the API pod
# (worker-topology decoupling, gaka-8bz follow-up). Same image as the
# server Deployment, run with --role=worker — no HTTP API, just the AMQP
# consumer (broker=rabbitmq) driving labelimages.Worker.RegenerateEntry.
#
# Inert under broker=inprocess: --role=worker only wires anything when
# BOOM_QUEUE_BROKER=rabbitmq (see cmd/boomtime/main.go's role/broker
# switch), so a cluster that hasn't opted in just runs an idle pod serving
# /healthz. The rabbit default-user secret + broker envs are optional so
# this Deployment schedules even without a broker provisioned.
#
# This lives in its own mini-kustomization (base/worker/) rather than as a
# bare file under base/ so overlays can reference it as `../../base/worker`
# — a cross-root kustomization reference, same as `../../base` itself —
# without tripping kustomize's default load-restrictor (which forbids a
# kustomization from listing a bare YAML file that lives outside its own
# root). It is deliberately NOT part of base/kustomization.yaml's own
# resources — each overlay opts in explicitly (see
# k8s/overlays/local/kustomization.yaml and
# k8s/overlays/talos00-knowledgedump/kustomization.yaml). The server
# Deployment (../deployment.yaml) is untouched by this file — the worker is
# a NEW workload alongside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boomtime-worker
  labels:
    app: boomtime-worker
    app.kubernetes.io/name: boomtime-worker
    app.kubernetes.io/part-of: catalyst
spec:
  replicas: 1 # KEDA drives this in prod (see keda-scaledobject.yaml)
  strategy:
    type: RollingUpdate # stateless consumer; no Recreate needed
  selector:
    matchLabels:
      app: boomtime-worker
  template:
    metadata:
      labels:
        app: boomtime-worker
        app.kubernetes.io/name: boomtime-worker
    spec:
      # Must exceed the max ComfyUI generation (~230s) so an in-flight regen
      # fully drains on SIGTERM before SIGKILL — otherwise the delivery stays
      # unacked and redelivers, re-firing ComfyUI (see keda-scaledobject.yaml).
      terminationGracePeriodSeconds: 600
      containers:
        - name: boomtime-worker
          image: ghcr.io/thebranchdriftcatalyst/boomtime:latest
          imagePullPolicy: IfNotPresent
          args: ["run", "--role=worker"]
          envFrom:
            - configMapRef:
                name: boomtime-config
            - secretRef:
                name: boomtime-secrets
                optional: true
            - secretRef:
                name: boomtime-encryption-key
                optional: true
          env:
            # Belt-and-suspenders with the --role=worker arg above: the
            # local overlay's dev image runs via `air` (no ENTRYPOINT, so
            # k8s `args` can't reach the built binary — see
            # patch-worker-deployment.yaml), which relies on THIS env var
            # as the sole role signal. Harmless duplication under prod's
            # real ENTRYPOINT, where the flag already wins.
            - name: BOOM_ROLE
              value: "worker"
            # DB creds (CNPG in prod / overlay-provided locally) — same as
            # the server Deployment.
            - name: BOOM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: boomtime-postgres-app
                  key: username
            - name: BOOM_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: boomtime-postgres-app
                  key: password
            # RabbitMQ creds from the operator's (or the local stub's)
            # default-user Secret; URL assembled via $(VAR) interpolation.
            # optional:true so base/local-without-rabbit still schedules
            # the pod — it just idles under broker=inprocess.
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: boomtime-rabbit-default-user
                  key: username
                  optional: true
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: boomtime-rabbit-default-user
                  key: password
                  optional: true
            - name: BOOM_RABBITMQ_URL
              value: "amqp://$(RABBIT_USER):$(RABBIT_PASS)@boomtime-rabbit.boomtime.svc.cluster.local:5672/"
          ports:
            - name: health
              containerPort: 8081 # minimal /healthz for probes; no API served
          resources:
            requests:
              cpu: 250m
              memory: 512Mi # sized for heavy regen, INDEPENDENT of the API pod
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
