---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3s target, driven by `tilt up` (see Tiltfile at repo root, TBD).
namespace: boomtime

resources:
  - ../../base
  - postgres.yaml
  - secrets.yaml
  # The boomtime-worker Deployment and the local RabbitMQ stand-in went with the
  # broker (boom-piig phase 3). Local now matches prod: one job system on the
  # Postgres queue, run in-process by the server (role=all), which is simpler to
  # reason about on a laptop than the old two-transport split.
  #
  # A no-GPU mock ComfyUI backend so label-image regen still works end-to-end
  # locally — that part was never broker-specific.
  - comfyui-mock.yaml
  # Dev-only Authentik stack (server+worker+pg+redis) + boomtime OIDC
  # blueprints. See authentik.yaml. boomtime still runs BOOM_AUTH_PROVIDER=local
  # until the OIDC resolver lands (boom-0oe.11).
  - authentik.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml
