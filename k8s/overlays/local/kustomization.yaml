---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3s target, driven by `tilt up` (see Tiltfile at repo root, TBD).
namespace: boomtime

resources:
  - ../../base
  - ../../base/worker
  - postgres.yaml
  - secrets.yaml
  # Worker-topology decoupling (boom-8bz follow-up, §9): plain RabbitMQ +
  # Redis (Dragonfly stand-in) + a no-GPU mock ComfyUI backend, so
  # `boomtime-worker` can execute image-generation jobs end-to-end on a
  # laptop. See docs/design/worker-topology-decoupling.md §9.
  - broker.yaml
  - comfyui-mock.yaml
  # Dev-only Authentik stack (server+worker+pg+redis) + boomtime OIDC
  # blueprints. See authentik.yaml. boomtime still runs BOOM_AUTH_PROVIDER=local
  # until the OIDC resolver lands (boom-0oe.11).
  - authentik.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml
  - path: patch-worker-deployment.yaml
