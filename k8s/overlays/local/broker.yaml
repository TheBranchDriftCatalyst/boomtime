---
# Local stand-ins for the homelab's operator-provisioned RabbitMQ +
# Dragonfly (worker-topology decoupling, boom-8bz follow-up, §9.1). Local
# k3s doesn't run the RabbitMQ Cluster / Dragonfly operators, so this
# overlay supplies its own broker as plain Deployments — base/ stays
# operator-agnostic; only this overlay knows it's not talking to a real
# operator-managed cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boomtime-rabbit
  namespace: boomtime
  labels: { app: boomtime-rabbit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: boomtime-rabbit }
  template:
    metadata:
      labels: { app: boomtime-rabbit }
    spec:
      containers:
        - name: rabbit
          image: rabbitmq:3.13-management
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: mgmt }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: boomtime }
            - { name: RABBITMQ_DEFAULT_PASS, value: boomtime }
---
apiVersion: v1
kind: Service
metadata:
  name: boomtime-rabbit
  namespace: boomtime
spec:
  selector: { app: boomtime-rabbit }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: mgmt, port: 15672, targetPort: mgmt }
---
# Plain Redis stands in for Dragonfly locally (same wire protocol; go-redis
# is agnostic). Swap the image for
# docker.dragonflydb.io/dragonflydb/dragonfly if you want the real thing —
# redis:7-alpine is lighter for a laptop and behaves identically for
# PUB/SUB + SET NX.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boomtime-cache
  namespace: boomtime
  labels: { app: boomtime-cache }
spec:
  replicas: 1
  selector:
    matchLabels: { app: boomtime-cache }
  template:
    metadata:
      labels: { app: boomtime-cache }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379, name: redis }]
---
apiVersion: v1
kind: Service
metadata:
  name: boomtime-cache
  namespace: boomtime
spec:
  selector: { app: boomtime-cache }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
