---
# Local dev credentials. NOT for prod (talos00-knowledgedump overlay uses CNPG-
# managed + ExternalSecret from 1Password). Safe to commit — values are dev-only
# and the postgres service is ClusterIP inside the local k3s.
apiVersion: v1
kind: Secret
metadata:
  name: boomtime-postgres-app
  labels:
    app.kubernetes.io/component: database
type: kubernetes.io/basic-auth
stringData:
  username: boomtime
  password: boomtime-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: boomtime-secrets
  labels:
    app.kubernetes.io/name: boomtime
type: Opaque
stringData:
  # Blank means the forwarder/GH-attribution features are inactive. Populate via
  # a .env.local overlay patch or `kubectl create secret` if you want to
  # exercise them locally. WAKATIME_API_KEY is per-user from the frontend, not
  # here.
  GITHUB_TOKEN: ""
  BOOM_REMOTE_WRITE_URL: ""
  BOOM_REMOTE_WRITE_TOKEN: ""
  # OIDC client secret — dev stub, MUST match the Authentik blueprint's
  # client_secret in authentik.yaml (boomtime-oidc.yaml). Kept in the Secret
  # (not the ConfigMap) to mirror the prod split where it comes from an
  # ExternalSecret (§6.7). Inert until BOOM_AUTH_PROVIDER=oidc (boom-0oe.11).
  BOOM_OIDC_CLIENT_SECRET: "boomtime-dev-client-secret-not-for-prod-0123456789abcdef"
---
# Worker-topology decoupling (boom-8bz follow-up): stub matching the
# RabbitMQ Cluster Operator's default-user Secret shape (keys: username,
# password, host, port) so worker-deployment.yaml's $(VAR) interpolation
# resolves identically here and in prod — the operator isn't running
# locally, so broker.yaml's plain rabbitmq:3.13-management Deployment sets
# these same credentials via RABBITMQ_DEFAULT_USER/PASS.
apiVersion: v1
kind: Secret
metadata:
  name: boomtime-rabbit-default-user
  labels:
    app.kubernetes.io/name: boomtime-rabbit
type: Opaque
stringData:
  username: boomtime
  password: boomtime
  host: boomtime-rabbit
  port: "5672"
