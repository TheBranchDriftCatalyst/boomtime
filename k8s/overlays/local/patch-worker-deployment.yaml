---
# Local dev: Tilt rebuilds and injects the SAME dev image the server
# Deployment uses (docker_build('boomtime', ...) in the Tiltfile matches
# any k8s manifest referencing image `boomtime:...`) — see patch-
# deployment.yaml for the parallel server-side patch.
#
# `args: null` clears the base's `--role=worker` flag: the local dev image
# runs via `air` (Dockerfile.dev has no ENTRYPOINT — CMD is
# `air -c .air.toml`), so k8s `args` would replace THAT command instead of
# reaching the built binary. Role selection here relies entirely on the
# BOOM_ROLE=worker env var the base manifest already sets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boomtime-worker
spec:
  template:
    spec:
      containers:
        - name: boomtime-worker
          image: boomtime:dev
          imagePullPolicy: Never
          args: null
          # Dev-only startupProbe: air compiles the whole app in-container on
          # first start, which can exceed the base liveness/readiness probe
          # window → cosmetic restarts (yellow in Tilt). Hold both probes off
          # (up to 5s×60=300s) until the binary is actually listening on
          # :8081. Prod bakes the binary (starts instantly) so it doesn't need
          # this. Once startup succeeds, base liveness/readiness take over.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 60
          # Same rationale as patch-deployment.yaml: air compiles the WHOLE
          # app in-container on every change, so grant build-time headroom
          # beyond the base's server-sized 512Mi/2Gi split.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
