---
# External HTTPS: dev.boomtime.knowledgedump.space.
# `tls: {}` uses Traefik's TLSStore default certificate (the pre-provisioned
# knowledgedump-wildcard-tls in the traefik ns), same as the prod route. The
# external-dns annotations are what create the Cloudflare record — losing them
# is the fiddly, non-obvious part of recreating this environment by hand, which
# is the main reason TALOS-hvcf exists.
#
# Captured from live. Note this route intentionally does NOT carry the
# analytics-boomtime middleware the prod route has: preview traffic should not
# land in the Plausible dataset for boomtime.knowledgedump.space.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boomtime-dev
  labels:
    app: boomtime-dev
    boomtime-variant: dev-refactor
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dev.boomtime.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dev.boomtime.knowledgedump.space`)
      services:
        - name: boomtime-dev
          port: 8080
  tls: {}
---
# HTTP→HTTPS redirect for the dev hostname (mirrors prod's
# boomtime-http-redirect).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boomtime-dev-http-redirect
  labels:
    app: boomtime-dev
    boomtime-variant: dev-refactor
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`dev.boomtime.knowledgedump.space`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: boomtime-dev
          port: 8080
