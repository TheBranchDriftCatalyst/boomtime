---
# ─────────────────────────────────────────────────────────────────────────────
# PROD OIDC client secret — the ONE secret piece of the OIDC wiring.
#
# This is a strategic-merge PATCH that EXTENDS the existing `boomtime-secrets`
# ExternalSecret (external-secret.yaml) with one more field, rather than a
# standalone Secret. Why a patch and not a new ExternalSecret: the base
# Deployment already `envFrom`s the `boomtime-secrets` Secret
# (k8s/base/deployment.yaml), so adding the key here means BOOM_OIDC_CLIENT_SECRET
# reaches the pod with NO deployment edit.
#
# INERT UNTIL ACTIVATED: not wired into kustomization.yaml's active
# patchesStrategicMerge — listed there commented-out. Uncommenting is step 4 of
# OIDC-PROD-WIRING.md.
#
# ⚠️  SYNC REQUIREMENT: kustomize strategic-merge treats a CRD list (`spec.data`)
# as an ATOMIC REPLACE — this patch must therefore re-declare the FULL data list
# and the FULL template.data map from external-secret.yaml, plus the new OIDC
# entry. If you add/rename a field in external-secret.yaml, mirror it here too,
# or activating this patch will DROP the omitted fields from the Secret. Keep
# the two files in lockstep.
#
# 1Password field to provision in vault item `boomtime`:
#   - oidc-client-secret  → BOOM_OIDC_CLIENT_SECRET
#     Populate it by copying the client_secret Authentik generates for the
#     boomtime provider (step 2 of OIDC-PROD-WIRING.md). NEVER commit the value.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: boomtime-secrets
  labels:
    app.kubernetes.io/name: boomtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: boomtime-secrets
    creationPolicy: Owner
    template:
      data:
        # ── mirrored from external-secret.yaml (keep in sync) ──
        GITHUB_TOKEN: "{{ .githubToken }}"
        BOOM_REMOTE_WRITE_URL: "{{ .remoteWriteUrl }}"
        BOOM_REMOTE_WRITE_TOKEN: "{{ .remoteWriteToken }}"
        # ── new: OIDC client secret ──
        BOOM_OIDC_CLIENT_SECRET: "{{ .oidcClientSecret }}"
  data:
    # ── mirrored from external-secret.yaml (keep in sync) ──
    - secretKey: githubToken
      remoteRef:
        key: boomtime
        property: github-token
    - secretKey: remoteWriteUrl
      remoteRef:
        key: boomtime
        property: remote-write-url
    - secretKey: remoteWriteToken
      remoteRef:
        key: boomtime
        property: remote-write-token
    # ── new: OIDC client secret from 1P field `oidc-client-secret` ──
    - secretKey: oidcClientSecret
      remoteRef:
        key: boomtime
        property: oidc-client-secret
