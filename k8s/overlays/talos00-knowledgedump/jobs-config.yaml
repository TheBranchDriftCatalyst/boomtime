---
# Kind-routing (gaka-hney): the always-on server + image worker EXCLUDE the
# heavy kinds (avatar-render, label-image), so those fall through to the KEDA
# ScaledJob (keda-scaledjob-jobs.yaml). Light kinds (github-stats-refresh) still
# drain on the server. The ScaledJob pods clear the exclude in their own env.
#
# BOOM_JOBS_UNIFIED=true (Stage 3): admin label-image regen enqueues onto the
# catalyst-go-jobs DB queue instead of the imagejobs RabbitMQ producer, so ALL
# jobs share one path + one worker model (the ScaledJob). The imagejobs pipeline
# + its ScaledObject/boomtime-worker become dormant (removed in the next stage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  BOOM_JOBS_EXCLUDE_KINDS: "avatar-render,label-image"
  BOOM_JOBS_UNIFIED: "true"
