---
# ─────────────────────────────────────────────────────────────────────────────
# Consolidated non-secret BOOM_* app config for the talos00-knowledgedump (prod)
# overlay. Strategic-merge patch that ADDs the overlay's feature/flag env vars
# onto the base `boomtime-config` ConfigMap without disturbing base keys.
#
# This single file replaces the former per-feature fragments (each was its own
# ConfigMap strategic-merge patch on `boomtime-config`):
#   label-images-config.yaml  llm-config.yaml   tz-config.yaml
#   github-config.yaml         oidc-config.yaml  usermodel-config.yaml
#   admin-cli-config.yaml      queue-config.yaml s3-config.yaml
#   jobs-config.yaml           books-config.yaml
# Rendered `data:` is byte-identical to their union — this was a pure structural
# consolidation, no value was flipped/added/removed. Secrets stay in their own
# manifests (oidc-external-secret.yaml, patch-server-s3.yaml, external-secret.yaml).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  # ── label-images feature (boom-myv) — comfyui-shim-external.yaml Service ────
  BOOM_FEATURE_LABEL_IMAGES: "on"
  BOOM_COMFYUI_SHIM_URL: "http://comfyui-shim:8012"
  BOOM_COMFYUI_MODEL: "chroma-hd"
  # admin allowlist — comma-separated usernames who see Settings > Admin tab.
  BOOM_ADMIN_USERS: "panda"

  # ── chibi-avatar LLM (boom-9v4) — ollama-shim-external.yaml → operator Mac ──
  BOOM_LLM_BASE_URL: "http://ollama-shim:11434/v1"
  BOOM_LLM_API_KEY: "ollama"
  BOOM_LLM_MODEL: "hf.co/TheDrummer/Cydonia-24B-v4.3-GGUF:Q8_0"

  # ── server-wide default timezone (boom-tz), IANA name; user choice wins ─────
  BOOM_DEFAULT_TIMEZONE: "America/Los_Angeles"

  # ── per-user GitHub connect (boom-2ip) — NON-SECRET keys only ───────────────
  # Master gate; inert until the OAuth-App creds + state signing key (Secrets,
  # oidc-external-secret.yaml) are also present.
  BOOM_FEATURE_GITHUB_STATS: "true"
  BOOM_GITHUB_OAUTH_REDIRECT_URL: "https://boomtime.knowledgedump.space/auth/github/callback"

  # ── PROD OIDC (Authentik) — NON-SECRET keys only; client_secret is a Secret ─
  # Password login is OFF (login is Authentik-only). ROLLBACK: set back to
  # "local" and redeploy.
  BOOM_AUTH_PROVIDER: "oidc"
  # TRAILING SLASH MATTERS (config.go discovery base).
  BOOM_OIDC_ISSUER: "https://auth.knowledgedump.space/application/o/boomtime/"
  BOOM_OIDC_CLIENT_ID: "boomtime"
  BOOM_OIDC_REDIRECT_URL: "https://boomtime.knowledgedump.space/auth/callback/oidc"
  BOOM_AUTHENTIK_GROUP_TO_ROLE: "boomtime-admin:admin,boomtime-full:full,boomtime-light:light"
  BOOM_OIDC_AUTOPROVISION: "false"
  # Keep autolink-by-email OFF (account-takeover footgun, boom-93f.12).
  BOOM_OIDC_AUTOLINK_EMAIL: "false"

  # ── RBAC user-model substrate (boom-93f) ────────────────────────────────────
  BOOM_FEATURE_USER_MODEL: "true"

  # ── admin CLI-runner (gaka Part C) — double-gated (admin allowlist + cap) ────
  BOOM_FEATURE_ADMIN_CLI: "true"

  # ── worker-topology decoupling (boom-8bz) — RabbitMQ cutover switch ─────────
  # BOOM_RABBITMQ_URL is assembled per-Deployment from the operator secret (see
  # patch-server-rabbit.yaml) — deliberately NOT here.
  BOOM_QUEUE_BROKER: "rabbitmq"
  BOOM_RABBITMQ_QUEUE: "boomtime.image-jobs"
  BOOM_REDIS_ADDR: "boomtime-cache.boomtime.svc.cluster.local:6379"
  # LAN-gated mgmt UI (rabbitmq-mgmt-ingressroute.yaml).
  BOOM_RABBITMQ_MGMT_URL: "http://boomtime-rabbit.talos00"

  # ── durable S3/MinIO social-card cache (boom-fym5) — NON-SECRET keys only ────
  # AWS_* creds ride patch-server-s3.yaml; inert until all four S3 vars present.
  BOOM_S3_ENDPOINT: "minio-hl.minio.svc.cluster.local:9000"
  BOOM_S3_BUCKET: "boomtime-cards"
  BOOM_S3_USE_SSL: "false"

  # ── kind-routing (boom-hney): heavy kinds fall through to the KEDA ScaledJob ─
  BOOM_JOBS_EXCLUDE_KINDS: "avatar-render,label-image"
  BOOM_JOBS_UNIFIED: "true"

  # ── catalyst-books / catalyst-audiobooks master gate (boom-books) ───────────
  BOOM_FEATURE_BOOKS: "true"
  # Audible library forward-sync cadence (finish detection: is_finished / ≥95% →
  # "read"). Code default is 6h; dropped to 1h so a finished audiobook promotes
  # reading→read within the hour without a manual "Sync now". Trade: more Audible
  # API calls. The near-real-time reading monitor (30s) is separate (live sessions).
  BOOM_AUDIBLE_SYNC_INTERVAL: "1h"
  # Hardcover as the terminal sink (project_hardcover_terminal_sink): with dry-run
  # OFF, boomtime WRITES to the user's real Hardcover — status/finish/rating pushes
  # (curation edits, the per-row sync button, and the audible finished-book sweep)
  # actually apply instead of being logged-and-blocked. Code default is true (safe);
  # this deliberately flips it to live writes. Set back to "true" to re-gate.
  BOOM_HARDCOVER_DRYRUN: "false"

  # ── OpenTelemetry tracing (TALOS-kvg1) ──────────────────────────────────────
  # Ships spans to the in-cluster Alloy collector, which already dual-writes
  # traces to BOTH Tempo and ClickStack/HyperDX (talos-homelab commit dc8d209)
  # — no cluster-side pipeline work needed. Tracing is opt-in in code: unset
  # OTEL_EXPORTER_OTLP_ENDPOINT and the SDK is never initialised.
  # otel_logs already carries TraceId/SpanId, and boomtime's slog now stamps
  # trace_id/span_id on every record, so HyperDX can pivot log -> trace.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc:4318"
  OTEL_SERVICE_NAME: "boomtime"
