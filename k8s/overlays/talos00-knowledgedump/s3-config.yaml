---
# S3 / MinIO durable social-card cache (gaka-fym5). Non-secret keys on
# boomtime-config; the AWS_* creds ride patch-server-s3.yaml from the reflected
# `boomtime-cards-s3-scoped` secret. Endpoint is the in-cluster MinIO tenant
# (ns minio), plain HTTP on :9000 (no TLS — requestAutoCert off), matching the
# talos-homelab scoped-users provisioner.
#
# INERT until the creds secret exists: config.S3Enabled() requires all four of
# endpoint+bucket+access+secret, so with only endpoint+bucket set here the
# og.png handler renders live every request (no cache) instead of erroring.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  BOOM_S3_ENDPOINT: "minio-hl.minio.svc.cluster.local:9000"
  BOOM_S3_BUCKET: "boomtime-cards"
  BOOM_S3_USE_SSL: "false"
