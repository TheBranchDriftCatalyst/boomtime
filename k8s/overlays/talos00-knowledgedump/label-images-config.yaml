---
# Overlay-only patch merging label-images feature vars into `boomtime-config`.
# Kustomize's strategic merge picks up matching (kind, name) and merges the
# `data:` maps, so this ADDS three keys without disturbing the base ones.
#
# See gaka-myv for the feature. Points at the in-cluster Service defined by
# comfyui-shim-external.yaml, which routes to the operator's Mac.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  BOOM_FEATURE_LABEL_IMAGES: "on"
  BOOM_COMFYUI_SHIM_URL: "http://comfyui-shim:8012"
  BOOM_COMFYUI_MODEL: "sdxl_illustrious_xl"
