---
# CloudNativePG Cluster for boomtime.
# CNPG auto-creates:
#   - Secret `boomtime-postgres-app` (keys: username, password, dbname, host,
#     port, pgpass, uri, jdbc-uri) — referenced by the Deployment for
#     BOOM_DB_USER / BOOM_DB_PASS.
#   - Secret `boomtime-postgres-superuser` (if superuserSecret unset, no external
#     access to the `postgres` role — safer default).
#   - Services `boomtime-postgres-rw` (primary), `-ro` (replicas), `-r` (any).
# The Deployment's ConfigMap points BOOM_DB_HOST at `boomtime-postgres-rw`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: boomtime-postgres
  labels:
    app.kubernetes.io/name: boomtime-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boomtime
spec:
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 3 # HA: streaming-replicated across nodes (already on NFS) (TALOS-hx77)
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: boomtime
      owner: boomtime
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  storage:
    size: 10Gi
    # local-path = the node's NVMe. Talos mounts its EPHEMERAL partition at /var,
    # which is exactly where local-path provisions, so this is direct NVMe rather
    # than a network round trip. Moved off NFS 2026-08-21 (talos-homelab TALOS-bna2).
    #
    # CHOSEN ON MEASUREMENT. Across all 11 CNPG clusters in the fleet,
    # cnpg_pg_stat_database_blks_read — disk reads that MISSED the shared buffer
    # cache — reads 0.00/s everywhere EXCEPT here, where it is 5.91/s. boomtime is
    # the only database in the cluster whose working set does not fit in RAM, so it
    # is the only one where storage latency shows up in query time at all. It also
    # commits 5.16 tx/s, and every commit costs a WAL fsync that was previously a
    # network round trip to the Synology. This is the DB behind the /heartbeats.bulk
    # p95 work, and the read path is the half that optimisation could not fix.
    #
    # SAFE ONLY BECAUSE instances IS 3. local-path is WaitForFirstConsumer, so each
    # PV pins to whichever node first mounts it. Three instances plus CNPG's default
    # pod anti-affinity puts three copies on three different nodes, so losing a node
    # loses one pinned volume and CNPG promotes a survivor automatically.
    # *** NEVER reduce this cluster to instances:1 while on local-path. *** That
    # combination is strictly worse than NFS: a node loss would strand the only copy
    # with no recovery short of a barman restore.
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  monitoring:
    # The global PodMonitor already scrapes CNPG pods; the dashboard dedups via
    # `max by(namespace,pod)` so a per-cluster PM is harmless but redundant.
    # Disabled so the global PodMonitor is the sole source (no double scrape).
    enablePodMonitor: false

  # Object-store backups → MinIO (talos-homelab TALOS-xgrl). Config lives in
  # the ObjectStore CR (objectstore.yaml) — migrated off the in-tree
  # barmanObjectStore (removed in CNPG 1.30) to the barman-cloud CNPG-I plugin,
  # same as the talos-homelab fleet. Same bucket/prefix; creds: the
  # cnpg-minio-backup Secret, reflected into the boomtime namespace from
  # minio/cnpg-backup in talos-homelab (its reflector allow-list must include
  # `boomtime` — see talos-homelab infrastructure/base/minio/cnpg-backup/).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: boomtime-postgres

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "16MB"
      maintenance_work_mem: "64MB"
      archive_mode: "on"
      archive_timeout: "5min"
      log_min_duration_statement: "1000"
    pg_hba:
      - host all all 10.0.0.0/8 md5
      - host all all 192.168.0.0/16 md5
