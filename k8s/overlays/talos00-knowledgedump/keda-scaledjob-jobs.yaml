---
# KEDA ScaledJob for the catalyst-go-jobs HEAVY DB kinds (boom-hney) — the
# PROPER primitive for long-running work. Unlike the image ScaledObject (which
# scales a Deployment and lets HPA SIGKILL a pod mid-render → RabbitMQ redelivery
# amplification), a ScaledJob schedules ONE Kubernetes Job per pending job: the
# pod claims work, runs it to completion, and exits. A running Job is NEVER
# terminated by scale-down, so there is no mid-job kill and no amplification.
#
# The pod runs boomtime with BOOM_JOBS_DRAIN=true + BOOM_JOBS_KINDS=avatar-render:
# it builds the registry, drains due avatar-render jobs to completion, and exits.
# The always-on server excludes avatar-render (BOOM_JOBS_EXCLUDE_KINDS) so those
# jobs fall through to here; the server still drains the light kinds itself.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: boomtime-jobs
  namespace: boomtime
spec:
  # KEDA polls the DB queue; when avatar-render jobs are pending it creates Jobs.
  pollingInterval: 20
  # SUPERSEDED BY THE WORKER POOL (boom-jokv). Replicas used to BE the
  # concurrency, because Drain was a sequential loop running one job per pod —
  # which is why liberation sat at 3-wide with 300+ queued while its cap said 5.
  #
  # Each pod now runs BOOM_JOBS_WORKERS jobs concurrently (default 4), so
  # potential concurrency is replicas x workers. The real ceiling is the
  # fleet-wide Redis semaphore: a kind never exceeds its own cap no matter how
  # many pods or workers exist. That is now the dial that binds, which is what it
  # was always meant to be.
  #
  # 5 is therefore generous rather than load-bearing — one pod with 4 workers can
  # nearly saturate a cap of 5 on its own. Extra pods that find every kind at cap
  # simply claim nothing and exit, so the overshoot is self-correcting.
  maxReplicaCount: 5
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # `default` accounts for already-running Jobs when deciding how many to add.
  scalingStrategy:
    strategy: default
  jobTargetRef:
    # One attempt per Job — the catalyst-go-jobs Store owns retry/backoff (a
    # retried job re-appears in the queue with a future run_at → a later Job).
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: boomtime-jobs
      spec:
        restartPolicy: Never
        # Avatar renders can take up to ~25 min; give an in-flight render room
        # to finish on SIGTERM. (ScaledJob won't scale a running Job down, but
        # this covers node drains / rollouts.)
        terminationGracePeriodSeconds: 1800
        containers:
          - name: boomtime-jobs
            image: ghcr.io/thebranchdriftcatalyst/boomtime:latest
            imagePullPolicy: IfNotPresent
            args: ["run", "--role=worker"]
            envFrom:
              - configMapRef:
                  name: boomtime-config
              - secretRef:
                  name: boomtime-secrets
                  optional: true
              - secretRef:
                  name: boomtime-encryption-key
                  optional: true
            env:
              - name: BOOM_ROLE
                value: "worker"
              # One-shot drain + exit; claim ONLY the heavy kind(s).
              - name: BOOM_JOBS_DRAIN
                value: "true"
              # LOCKSTEP WITH THE TRIGGER QUERY at the bottom of this file. Add a
              # kind here but not there and pods never spawn; add it there but not
              # here and pods spawn, claim nothing, and exit — a scale-up loop
              # doing no work. Change both or neither.
              - name: BOOM_JOBS_KINDS
                value: "avatar-render,label-image,books-liberate-book"
              # Belt-and-braces: boomtime-config no longer sets
              # BOOM_JOBS_EXCLUDE_KINDS (it made SetOffload dead code — see the
              # comment there), so this clear is now a no-op. Kept so that if
              # anyone re-adds the var to boomtime-config for an incident, this
              # pod does not end up both including AND excluding its own kinds
              # and claiming nothing.
              - name: BOOM_JOBS_EXCLUDE_KINDS
                value: ""
              - name: BOOM_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: boomtime-postgres-app
                    key: username
              - name: BOOM_DB_PASS
                valueFrom:
                  secretKeyRef:
                    name: boomtime-postgres-app
                    key: password
            # catalyst-books liberation (boom-w20s) needs the library it writes
            # into and scratch to work in. A drain pod cannot liberate into a
            # volume it has not mounted, and without the emptyDir the AAXC + M4B
            # land on the node's unbounded ephemeral storage.
            volumeMounts:
              - name: audiobook-library
                mountPath: /media/audiobooks/liberated
                subPath: audiobooks/liberated
              - name: liberate-work
                mountPath: /tmp/boomtime-liberate
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
                ephemeral-storage: 2Gi
              limits:
                cpu: "2"
                memory: 2Gi
                ephemeral-storage: 14Gi
        volumes:
          - name: audiobook-library
            persistentVolumeClaim:
              claimName: boomtime-audiobook-library
          # Sized for ONE pod, not the fleet: the per-kind concurrency cap is
          # enforced fleet-wide through the Redis semaphore (envFrom
          # boomtime-config supplies BOOM_REDIS_ADDR), so a single drain pod holds
          # only its share. ~2GB per in-flight book; 12Gi is generous headroom.
          - name: liberate-work
            emptyDir:
              sizeLimit: 12Gi
        # Spread drain pods across nodes instead of stacking them on talos06.
        # ScheduleAnyway, NOT DoNotSchedule: only talos02-gpu and talos06 are
        # untainted (talos01/talos03 are PreferNoSchedule, talos00 is a
        # NoSchedule control-plane), so a hard constraint would leave the third
        # pod permanently Pending.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: boomtime-jobs
  triggers:
    - type: postgresql
      metadata:
        # Host/port/dbName in metadata (non-sensitive) — the CNPG secret's `host`
        # is a BARE service name that doesn't resolve from the keda namespace, so
        # we use the FQDN here. Only userName/password come from the TriggerAuth.
        host: boomtime-postgres-rw.boomtime.svc.cluster.local
        port: "5432"
        dbName: boomtime
        sslmode: disable
        # Pending, DUE heavy jobs. count>0 ⇒ schedule a Job to drain them.
        query: "SELECT count(*) FROM jobs WHERE status = 'queued' AND run_at <= now() AND kind IN ('avatar-render','label-image','books-liberate-book')"
        targetQueryValue: "1"
      authenticationRef:
        name: boomtime-jobs-pg-auth
