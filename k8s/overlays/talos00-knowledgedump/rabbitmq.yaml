---
# RabbitMQ broker for the worker-topology decoupling (gaka-8bz follow-up).
# Provisioned via the homelab's RabbitMQ Cluster Operator + Messaging
# Topology Operator (already installed cluster-wide — see
# talos-homelab/applications/crossplane-demo/rabbitmq.yaml, mirrored here).
# The operator creates Service `boomtime-rabbit` + Secret
# `boomtime-rabbit-default-user` (keys: username, password, host, port).
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: boomtime-rabbit
  namespace: boomtime
spec:
  replicas: 1
  rabbitmq:
    additionalConfig: |
      prometheus.return_per_object_metrics = true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    # Broker mnesia dir; NFS is a poor fit (see docs/design/worker-topology-
    # decoupling.md §10 open question 3 — confirm this class exists on
    # talos00, or swap to whatever local/SSD class the cluster provides).
    storageClassName: local-path
    storage: 1Gi
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: boomtime-image-jobs
  namespace: boomtime
spec:
  name: boomtime.image-jobs
  durable: true
  autoDelete: false
  rabbitmqClusterReference:
    name: boomtime-rabbit
