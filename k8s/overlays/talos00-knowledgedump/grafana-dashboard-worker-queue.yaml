---
# GrafanaDashboard CR: "boomtime — Image-Job Worker Queue" (worker-topology
# decoupling, gaka-8bz follow-up). Mirrors the shape used across
# talos-homelab's own dashboards (grafana-operator v5.20+,
# apiVersion grafana.integreatly.org/v1beta1). Lives in the `boomtime`
# namespace rather than the homelab's central `monitoring` namespace —
# the operator's HelmRelease sets `namespaceScope: false` ("watch all
# namespaces for GrafanaDashboard CRs"), so this reconciles into the same
# shared Grafana instance without needing a change in the talos-homelab
# repo. `folderRef: ops-app` slots it into the existing "Ops > App" folder
# (talos-homelab/infrastructure/base/monitoring/grafana-dashboards/
# folders/ops.yaml) — best-effort: if that folder ref doesn't resolve
# across namespaces the way instanceSelector does, drop folderRef entirely
# (dashboard lands in the default "General" folder instead) rather than
# blocking the rest of the boomtime overlay.
#
# JSON lives at grafana/worker-queue-dashboard.json, packaged into the
# `dashboard-boomtime-worker-queue` ConfigMap by the kustomization
# configMapGenerator (disableNameSuffixHash: true, already set below the
# secretGenerator in this file's kustomization.yaml). uid
# "boomtime-worker-queue" is stable (set inside the JSON itself).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: boomtime-worker-queue
  namespace: boomtime
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: boomtime
spec:
  folderRef: ops-app
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-boomtime-worker-queue
    key: worker-queue-dashboard.json
