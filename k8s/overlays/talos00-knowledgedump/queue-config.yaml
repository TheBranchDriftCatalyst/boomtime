---
# Strategic-merge patch adding worker-topology decoupling (gaka-8bz
# follow-up) vars into `boomtime-config`. BOOM_RABBITMQ_URL is NOT here —
# it's assembled per-Deployment from the operator's `boomtime-rabbit-
# default-user` Secret via $(VAR) interpolation (see
# k8s/base/worker/deployment.yaml + patch-server-rabbit.yaml).
#
# Setting BOOM_QUEUE_BROKER=rabbitmq here is the actual cutover — it flips
# BOTH the server (publishes via AMQPProducer instead of the in-process
# Registry) and the worker (consumes via AMQPConsumer) onto the decoupled
# path. Revert by deleting this key (or setting it back to "inprocess")
# and scaling boomtime-worker to 0 — see docs/design/worker-topology-
# decoupling.md §10 rollout stage (d).
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  BOOM_QUEUE_BROKER: "rabbitmq"
  BOOM_RABBITMQ_QUEUE: "boomtime.image-jobs"
  BOOM_REDIS_ADDR: "boomtime-cache.boomtime.svc.cluster.local:6379"
  # LAN-gated mgmt UI (rabbitmq-mgmt-ingressroute.yaml) — surfaced by
  # AdminLabelImagesInfo so the Admin tab can link to it directly.
  BOOM_RABBITMQ_MGMT_URL: "http://boomtime-rabbit.talos00"
