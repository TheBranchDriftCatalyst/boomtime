---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD Application spec.source.path points here.
namespace: boomtime

resources:
  - ../../base
  - postgres-cluster.yaml
  - objectstore.yaml # barman-cloud plugin backup config (was Cluster.spec.backup)
  # cnpg-minio-backup secret arrives via reflector from talos-homelab's
  # minio/cnpg-backup ExternalSecret (its allow-list includes `boomtime`).
  - scheduledbackup.yaml # daily base backup → cnpg-backups bucket (03:45)
  - external-secret.yaml
  - ingressroute.yaml
  - comfyui-shim-external.yaml
  - ollama-shim-external.yaml
  # ── Worker-topology decoupling (gaka-8bz) — PROD CUTOVER DEFERRED ─────────
  # These + the queue-config / patch-server-rabbit / secretGenerator /
  # configMapGenerator blocks below ARE the prod cutover for the image-job
  # worker queue (+ its RabbitMQ mgmt UI, metrics scrape, and Grafana
  # dashboard). They reached main before the local `tilt up` demo was
  # verified, so they are UN-WIRED here to keep prod on the safe in-process
  # image worker (BOOM_QUEUE_BROKER unset = inprocess default; server
  # behavior byte-identical to today). RE-ENABLE all blocks TOGETHER as the
  # deliberate cutover once the local demo passes — the ops-visibility
  # additions (mgmt UI route, PodMonitor, dashboard) are only meaningful
  # once boomtime-rabbit actually exists. See docs/design/worker-topology-
  # decoupling.md §8.
  # CUTOVER PHASE 1 (2026-08-09): provision the broker infra via the operators
  # FIRST and let it reach Ready before flipping BOOM_QUEUE_BROKER (phase 2) —
  # so the server connects on first boot instead of crash-looping while
  # RabbitMQ provisions. rabbitmq-cluster + messaging-topology + dragonfly ops.
  - rabbitmq.yaml   # RabbitmqCluster boomtime-rabbit + Queue boomtime.image-jobs
  - dragonfly.yaml  # Dragonfly boomtime-cache (redis-compatible)
  # ── CUTOVER PHASE 2 (2026-08-09): RabbitMQ+Dragonfly Ready → flip the switch ──
  - ../../base/worker              # boomtime-worker Deployment (--role=worker, consumes AMQP)
  - keda-scaledobject.yaml         # KEDA queue-length autoscaling + scale-to-zero (image jobs)
  - keda-triggerauth.yaml          # scaler auth (rabbit + the postgres jobs scaler)
  - keda-scaledjob-jobs.yaml       # KEDA ScaledJob — heavy catalyst-go-jobs kinds (avatar-render)
  - rabbitmq-mgmt-ingressroute.yaml # LAN-only mgmt UI (boomtime-rabbit.talos00)
  - rabbitmq-podmonitor.yaml       # Prometheus scrape of the operator metrics
  - grafana-dashboard-worker-queue.yaml # GrafanaDashboard CR (Ops > App folder)
  - keda-servicemonitor.yaml       # scrape KEDA operator metrics (keda ns) for the dashboard
  - grafana-dashboard-keda.yaml    # GrafanaDashboard CR — KEDA autoscaling (Ops > App)
  # ── DOMAIN dashboards (Apps folder) — what boomtime DID, not pod health ────
  # Sibling perspective to the two Ops > App dashboards above. The "Apps"
  # GrafanaFolder itself is declared centrally in talos-homelab
  # (infrastructure/base/monitoring/grafana-dashboards/folders/apps.yaml);
  # these CRs only reference it via folderRef. Both are built on boomtime's own
  # JSON slog output in Loki plus the KEDA/RabbitMQ metrics already scraped
  # above — the app exports no Prometheus metrics of its own.
  - grafana-dashboard-daily-review.yaml   # job runs, backlog, domain outcomes, log review
  - grafana-dashboard-domain-ingest.yaml  # heartbeat/health ingest volume, outcome, latency

# Strategic-merge patches: each adds a feature-specific set of env vars
# to the base boomtime-config ConfigMap without disturbing existing keys.
patchesStrategicMerge:
  - label-images-config.yaml
  - llm-config.yaml
  - tz-config.yaml
  # gaka-2ip Phase 1: per-user GitHub connect. Non-secret BOOM_* keys
  # (BOOM_FEATURE_GITHUB_STATS + redirect URL); the OAuth-App creds + state
  # signing key ride the boomtime-secrets ExternalSecret. INERT until those 1P
  # fields are provisioned (config.GithubConnectEnabled gates every route +
  # the config/public flag). See github-config.yaml header.
  - github-config.yaml
  # ── PROD OIDC (Authentik) wiring — ACTIVATED 2026-08-05 ──────────────────────
  # Authentik side is live (provider/app/groups + client_secret in 1Password
  # `oidc-client-secret`), issuer confirmed. These add BOOM_OIDC_* config +
  # deliver BOOM_OIDC_CLIENT_SECRET. BOOM_AUTH_PROVIDER stays "local" (see
  # oidc-config.yaml) — this only makes OIDC *configured* so the account-LINK
  # flow works; password login is unchanged. Flip to "oidc" is a later,
  # separate change. Full procedure: OIDC-PROD-WIRING.md.
  - oidc-config.yaml          # non-secret BOOM_OIDC_* keys on boomtime-config
  - oidc-external-secret.yaml # BOOM_OIDC_CLIENT_SECRET from 1Password
  - oidc-hostaliases.yaml     # pod->Authentik goes internal (bypass Cloudflare, gaka-93f.11.2)
  - usermodel-config.yaml     # BOOM_FEATURE_USER_MODEL=true — RBAC enforcement ON
  - admin-cli-config.yaml     # BOOM_FEATURE_ADMIN_CLI=true — admin CLI-runner ON (admin-gated)
  # ── Worker-topology cutover — ACTIVE (2026-08-09; RabbitMQ provisioned Ready in phase 1) ──
  - queue-config.yaml         # BOOM_QUEUE_BROKER=rabbitmq — THE cutover switch
  - patch-server-rabbit.yaml  # server: --role=server + amqp URL
  # ── Durable S3 social-card cache (gaka-fym5) ─────────────────────────────
  # Non-secret endpoint/bucket on boomtime-config + the scoped MinIO creds on
  # the server (optional refs → inert until talos-homelab reflects the
  # boomtime-cards-s3-scoped secret). og.png renders live until all four
  # BOOM_S3_* are present (config.S3Enabled()).
  - s3-config.yaml            # BOOM_S3_ENDPOINT/BUCKET/USE_SSL (non-secret)
  - patch-server-s3.yaml      # BOOM_S3_ACCESS_KEY/SECRET_KEY (optional secretKeyRef)
  - jobs-config.yaml          # BOOM_JOBS_EXCLUDE_KINDS=avatar-render (route heavy → ScaledJob)
  - books-config.yaml         # BOOM_FEATURE_BOOKS=true — Connect-Amazon flow live (gaka-books)
  # NOTE: authentik-blueprint-boomtime.yaml is an Authentik blueprint, NOT a k8s
  # manifest — it is intentionally never added here (applied to Authentik itself).

# KEDA amqp-scaler host secret + the Grafana dashboard JSON ConfigMap —
# ACTIVE with the phase-2 cutover above.
secretGenerator:
  - name: boomtime-rabbit-keda-host
    literals:
      - host=amqp://boomtime-rabbit.boomtime.svc.cluster.local:5672/
configMapGenerator:
  - name: dashboard-boomtime-worker-queue
    files:
      - grafana/worker-queue-dashboard.json
  - name: dashboard-boomtime-keda
    files:
      - grafana/keda-dashboard.json
  # Domain dashboards (Apps folder)
  - name: dashboard-boomtime-daily-review
    files:
      - grafana/daily-review-dashboard.json
  - name: dashboard-boomtime-domain-ingest
    files:
      - grafana/domain-ingest-dashboard.json
generatorOptions:
  disableNameSuffixHash: true

# The Argo Application tracks the `main` branch. This kustomize `newTag`
# is a starting hint — the live authority is the ImageUpdater CRD at
# talos-homelab:infrastructure/base/argocd/image-updater/boomtime-image-updater.yaml,
# which rewrites spec.source.kustomize.images on the Argo Application whenever
# ghcr publishes a new tag matching its allowTags regex
# (latest|main|sha-<7c>). The immutable sha-<7c> tag is what drives per-commit
# auto-deploy off main pushes.
images:
  - name: ghcr.io/thebranchdriftcatalyst/boomtime
    newTag: latest
