---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD Application spec.source.path points here.
namespace: boomtime

resources:
  - ../../base
  - postgres-cluster.yaml
  - objectstore.yaml # barman-cloud plugin backup config (was Cluster.spec.backup)
  # cnpg-minio-backup secret arrives via reflector from talos-homelab's
  # minio/cnpg-backup ExternalSecret (its allow-list includes `boomtime`).
  - scheduledbackup.yaml # daily base backup → cnpg-backups bucket (03:45)
  # ── catalyst-books standalone DB (talos-homelab TALOS-1psu) ───────────────
  # Captured from a live, hand-applied cluster that no GitOps system owned and
  # that had NO backup from either system. Listed here so Argo CD adopts it;
  # the ObjectStore + ScheduledBackup are new and close the backup gap.
  - books-postgres-cluster.yaml
  - books-postgres-objectstore.yaml
  - books-postgres-scheduledbackup.yaml
  - external-secret.yaml
  - ingressroute.yaml
  - servicemonitor.yaml # scrape boomtime's own /metrics (gaka-metrics: RED + business counters)
  - comfyui-shim-external.yaml
  - ollama-shim-external.yaml
  # ── Worker-topology decoupling (gaka-8bz) — PROD CUTOVER DEFERRED ─────────
  # These + the queue-config / patch-server-rabbit / secretGenerator /
  # configMapGenerator blocks below ARE the prod cutover for the image-job
  # worker queue (+ its RabbitMQ mgmt UI, metrics scrape, and Grafana
  # dashboard). They reached main before the local `tilt up` demo was
  # verified, so they are UN-WIRED here to keep prod on the safe in-process
  # image worker (BOOM_QUEUE_BROKER unset = inprocess default; server
  # behavior byte-identical to today). RE-ENABLE all blocks TOGETHER as the
  # deliberate cutover once the local demo passes — the ops-visibility
  # additions (mgmt UI route, PodMonitor, dashboard) are only meaningful
  # once boomtime-rabbit actually exists. See docs/design/worker-topology-
  # decoupling.md §8.
  # CUTOVER PHASE 1 (2026-08-09): provision the broker infra via the operators
  # FIRST and let it reach Ready before flipping BOOM_QUEUE_BROKER (phase 2) —
  # so the server connects on first boot instead of crash-looping while
  # RabbitMQ provisions. rabbitmq-cluster + messaging-topology + dragonfly ops.
  - rabbitmq.yaml   # RabbitmqCluster boomtime-rabbit + Queue boomtime.image-jobs
  - dragonfly.yaml  # Dragonfly boomtime-cache (redis-compatible)
  # ── CUTOVER PHASE 2 (2026-08-09): RabbitMQ+Dragonfly Ready → flip the switch ──
  - ../../base/worker              # boomtime-worker Deployment (--role=worker, consumes AMQP)
  - keda-scaledobject.yaml         # KEDA queue-length autoscaling + scale-to-zero (image jobs)
  - keda-triggerauth.yaml          # scaler auth (rabbit + the postgres jobs scaler)
  - keda-scaledjob-jobs.yaml       # KEDA ScaledJob — heavy catalyst-go-jobs kinds (avatar-render)
  - rabbitmq-mgmt-ingressroute.yaml # LAN-only mgmt UI (boomtime-rabbit.talos00)
  - rabbitmq-podmonitor.yaml       # Prometheus scrape of the operator metrics
  - keda-servicemonitor.yaml       # scrape KEDA operator metrics (keda ns) for the dashboard
  # ── CONSOLIDATED dashboards (4→2, gaka-metrics follow-up) ──────────────────
  # The former per-concern boards (grafana-dashboard-{keda,worker-queue,
  # daily-review,domain-ingest}.yaml) were merged into two, rebuilt around the
  # app's now-scraped first-party Prometheus metrics (servicemonitor.yaml) while
  # carrying the still-relevant KEDA/RabbitMQ (Ops) and Loki slog (Domain)
  # panels forward verbatim.
  #
  # Ops (folderUID ops-app): RED (incoming router + outbound clients), Go/
  # process runtime, DB + Redis pools, cache hit-rate, the concurrency + HTTP
  # rate limiters, and the KEDA/queue autoscaling panels.
  - grafana-dashboard-service-infra.yaml  # "boomtime · Service & Infra" (Ops > App)
  # Domain (folderUID apps, sibling of Ops — declared centrally in talos-homelab
  # infrastructure/base/monitoring/grafana-dashboards/folders/apps.yaml): the
  # first-party ingest/jobs/business counters on top, the validated Loki slog
  # narrative (job runs, domain outcomes, daily review, ingest failures) below.
  - grafana-dashboard-domain-jobs.yaml    # "boomtime · Domain & Jobs" (Apps)
  # Reading-monitor cadence diagnostic (Apps folder, sibling of Domain & Jobs):
  # the whispersync two-level polling probe — advance-interval p50/p90 = the
  # recommended T2/G, active-books + advance rate, and the per-book Loki advance
  # feed. Deep-linked by the admin reading-monitor panel via uid
  # boomtime-reading-monitor. See docs/design/catalyst-books-domain-architecture.md §5.1.
  - grafana-dashboard-reading-monitor.yaml # "boomtime · Reading monitor (whispersync cadence)" (Apps)

# Strategic-merge patches on the base boomtime-config ConfigMap + boomtime
# Deployment.
#
# app-config.yaml is the SINGLE consolidated non-secret BOOM_* ConfigMap patch
# for this overlay — the union of the former per-feature fragments
# (label-images / llm / tz / github / oidc / usermodel / admin-cli / queue / s3
# / jobs / books -config.yaml), merged with no value changed. Feature-flag
# provenance is documented inline in app-config.yaml.
#
# The remaining entries are NOT ConfigMap patches: oidc-external-secret.yaml is
# an ExternalSecret (boomtime-secrets), and the patch-server-* files patch the
# boomtime Deployment. The OIDC hostAlias is NO LONGER patched here at all: the
# pod carries catalyst.io/oidc=true from k8s/base/deployment.yaml, and the
# cluster-wide Kyverno ClusterPolicy oidc-hostalias injects the alias at
# admission. Both the old oidc-hostaliases.yaml and its oidc-kyverno-label.yaml
# successor are gone.
patchesStrategicMerge:
  - app-config.yaml           # consolidated non-secret BOOM_* keys on boomtime-config
  - oidc-external-secret.yaml # BOOM_OIDC_CLIENT_SECRET (+ github/remote-write) from 1Password
  - patch-server-rabbit.yaml  # server: --role=server + amqp URL
  - patch-server-s3.yaml      # BOOM_S3_ACCESS_KEY/SECRET_KEY (optional secretKeyRef)
  # NOTE: authentik-blueprint-boomtime.yaml is an Authentik blueprint, NOT a k8s
  # manifest — it is intentionally never added here (applied to Authentik itself).

# KEDA amqp-scaler host secret + the Grafana dashboard JSON ConfigMap —
# ACTIVE with the phase-2 cutover above.
secretGenerator:
  - name: boomtime-rabbit-keda-host
    literals:
      - host=amqp://boomtime-rabbit.boomtime.svc.cluster.local:5672/
configMapGenerator:
  # Consolidated 4→2 (see the resources block above). Ops board.
  - name: dashboard-boomtime-service-infra
    files:
      - grafana/service-infra-dashboard.json
  # Domain board (Apps folder).
  - name: dashboard-boomtime-domain-jobs
    files:
      - grafana/domain-jobs-dashboard.json
  # Reading-monitor cadence board (Apps folder).
  - name: dashboard-boomtime-reading-monitor
    files:
      - grafana/reading-monitor-dashboard.json
generatorOptions:
  disableNameSuffixHash: true

# The Argo Application tracks the `main` branch. This kustomize `newTag`
# is a starting hint — the live authority is the ImageUpdater CRD at
# talos-homelab:infrastructure/base/argocd/image-updater/boomtime-image-updater.yaml,
# which rewrites spec.source.kustomize.images on the Argo Application whenever
# ghcr publishes a new tag matching its allowTags regex
# (latest|main|sha-<7c>). The immutable sha-<7c> tag is what drives per-commit
# auto-deploy off main pushes.
images:
  - name: ghcr.io/thebranchdriftcatalyst/boomtime
    newTag: latest
