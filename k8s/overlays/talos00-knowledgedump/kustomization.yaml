---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD Application spec.source.path points here.
namespace: boomtime

resources:
  - ../../base
  - postgres-cluster.yaml
  - external-secret.yaml
  - ingressroute.yaml
  - comfyui-shim-external.yaml
  - ollama-shim-external.yaml

# Strategic-merge patches: each adds a feature-specific set of env vars
# to the base boomtime-config ConfigMap without disturbing existing keys.
patchesStrategicMerge:
  - label-images-config.yaml
  - llm-config.yaml
  - tz-config.yaml
  # gaka-2ip Phase 1: per-user GitHub connect. Non-secret BOOM_* keys
  # (BOOM_FEATURE_GITHUB_STATS + redirect URL); the OAuth-App creds + state
  # signing key ride the boomtime-secrets ExternalSecret. INERT until those 1P
  # fields are provisioned (config.GithubConnectEnabled gates every route +
  # the config/public flag). See github-config.yaml header.
  - github-config.yaml
  # ── PROD OIDC (Authentik) wiring — ACTIVATED 2026-08-05 ──────────────────────
  # Authentik side is live (provider/app/groups + client_secret in 1Password
  # `oidc-client-secret`), issuer confirmed. These add BOOM_OIDC_* config +
  # deliver BOOM_OIDC_CLIENT_SECRET. BOOM_AUTH_PROVIDER stays "local" (see
  # oidc-config.yaml) — this only makes OIDC *configured* so the account-LINK
  # flow works; password login is unchanged. Flip to "oidc" is a later,
  # separate change. Full procedure: OIDC-PROD-WIRING.md.
  - oidc-config.yaml          # non-secret BOOM_OIDC_* keys on boomtime-config
  - oidc-external-secret.yaml # BOOM_OIDC_CLIENT_SECRET from 1Password
  - oidc-hostaliases.yaml     # pod->Authentik goes internal (bypass Cloudflare, gaka-93f.11.2)
  - usermodel-config.yaml     # BOOM_FEATURE_USER_MODEL=true — RBAC enforcement ON
  # NOTE: authentik-blueprint-boomtime.yaml is an Authentik blueprint, NOT a k8s
  # manifest — it is intentionally never added here (applied to Authentik itself).

# The Argo Application tracks the `main` branch. This kustomize `newTag`
# is a starting hint — the live authority is the ImageUpdater CRD at
# talos-homelab:infrastructure/base/argocd/image-updater/boomtime-image-updater.yaml,
# which rewrites spec.source.kustomize.images on the Argo Application whenever
# ghcr publishes a new tag matching its allowTags regex
# (latest|main|sha-<7c>). The immutable sha-<7c> tag is what drives per-commit
# auto-deploy off main pushes.
images:
  - name: ghcr.io/thebranchdriftcatalyst/boomtime
    newTag: latest
