---
# Pulls runtime secrets from 1Password vault `catalyst-eso`, item `boomtime`.
# The 1P item must expose fields matching remoteRef.property below.
# Fields to provision in the 1P item:
#   - github-token            → GITHUB_TOKEN (attribute time to commits)
#   - remote-write-url        → BOOM_REMOTE_WRITE_URL (optional forward target)
#   - remote-write-token      → BOOM_REMOTE_WRITE_TOKEN (optional)
# NOT here:
#   - DB creds (BOOM_DB_USER / BOOM_DB_PASS) — come from CNPG-managed
#     `boomtime-postgres-app` Secret; see deployment.yaml.
#   - WAKATIME_API_KEY — supplied per-user from the frontend, not a
#     system-wide env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boomtime-secrets
  labels:
    app.kubernetes.io/name: boomtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: boomtime-secrets
    creationPolicy: Owner
    template:
      data:
        GITHUB_TOKEN: "{{ .githubToken }}"
        BOOM_REMOTE_WRITE_URL: "{{ .remoteWriteUrl }}"
        BOOM_REMOTE_WRITE_TOKEN: "{{ .remoteWriteToken }}"
        # boom-2ip: GitHub connect creds (INERT until BOOM_FEATURE_GITHUB_STATS
        # + all three non-empty). Mirrored in oidc-external-secret.yaml — that
        # atomic-replace patch is the ACTIVE one, so keep the two in lockstep.
        BOOM_GITHUB_OAUTH_CLIENT_ID: "{{ .githubOAuthClientId }}"
        BOOM_GITHUB_OAUTH_CLIENT_SECRET: "{{ .githubOAuthClientSecret }}"
        BOOM_OAUTH_STATE_SIGNING_KEY: "{{ .oauthStateSigningKey }}"
  data:
    - secretKey: githubToken
      remoteRef:
        key: boomtime
        property: github-token
    - secretKey: remoteWriteUrl
      remoteRef:
        key: boomtime
        property: remote-write-url
    - secretKey: remoteWriteToken
      remoteRef:
        key: boomtime
        property: remote-write-token
    # boom-2ip: 1Password fields for GitHub connect (provision before activating).
    - secretKey: githubOAuthClientId
      remoteRef:
        key: boomtime
        property: github-oauth-client-id
    - secretKey: githubOAuthClientSecret
      remoteRef:
        key: boomtime
        property: github-oauth-client-secret
    - secretKey: oauthStateSigningKey
      remoteRef:
        key: boomtime
        property: oauth-state-signing-key
