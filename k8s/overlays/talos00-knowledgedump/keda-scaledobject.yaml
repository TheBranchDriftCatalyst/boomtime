---
# KEDA autoscaling for boomtime-worker on RabbitMQ queue depth, with
# scale-to-zero (worker-topology decoupling, boom-8bz follow-up). Real
# `rabbitmq` trigger (protocol: amqp, mode: QueueLength) — the homelab
# demo's scaledobject.yaml carries this same trigger commented out because
# it needed a TriggerAuthentication; keda-triggerauth.yaml supplies that.
#
# Revert: pause via the `autoscaling.keda.sh/paused-replicas` annotation,
# or delete this resource — the Deployment holds its last replica count.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: boomtime-worker
  namespace: boomtime
spec:
  scaleTargetRef:
    name: boomtime-worker
  minReplicaCount: 0 # scale-to-zero when the queue is empty
  maxReplicaCount: 4
  # MUST exceed the max ComfyUI generation time (~230s observed). The amqp
  # scaler counts READY messages, which drop to 0 the instant a worker consumes
  # (the delivery goes unacked). A short cooldown then scales the worker down
  # mid-generation → SIGKILL before the job acks → RabbitMQ redelivers → the
  # next worker re-fires ComfyUI → amplification loop (one press → N images).
  # 600s keeps the worker alive well past any single generation.
  cooldownPeriod: 600
  pollingInterval: 20
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: boomtime.image-jobs
        mode: QueueLength
        value: "3" # ~3 queued regens per replica
      authenticationRef:
        name: boomtime-rabbit-auth
