---
# catalyst-books / catalyst-audiobooks master gate (gaka-books). Turns on the
# shared Amazon connect flow (Settings → Connect Amazon) + the /api/v1/amazon/*
# mutation routes. The credential is stored encrypted under BOOM_ENCRYPTION_KEY
# (already provisioned) and registered in internal/domains so key-rotation +
# backups cover it. Ingest jobs are still stubbed — this only lights up the
# connect flow for live testing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  BOOM_FEATURE_BOOKS: "true"
