---
# Mounts the audiobook library into the boomtime server for catalyst-books
# liberation (boom-w20s). Strategic-merge patch, peer of patch-server-s3.yaml.
#
# WHY subPath: audiobooks/liberated
# The PV mounts the /volume1/media export root (the only media path the Synology
# actually serves — verified with `showmount -e 192.168.1.36`). That share holds
# every media library, so boomtime is scoped by subPath into
# audiobooks/liberated: its output stays separable from everything else, and a
# bug in the naming template can never scribble across the rest of the share.
# kubelet creates the subPath directory on first mount if it is absent, which is
# what makes the container path exist without an initContainer.
# (liberate.NewFSSink deliberately refuses to MkdirAll its root: an unmounted
# volume must fail loudly rather than silently fill the pod's ephemeral layer
# with audiobooks that vanish on the next deploy.)
#
# WHY the worker does NOT get this mount
# Liberation jobs run on the server role today. When they move to the worker
# fleet, copy this volume/volumeMount pair into patch-worker-* as well — the
# job cannot write to a library it has not mounted.
# WHY THE WORK DIR IS AN emptyDir WITH A sizeLimit
# Liberation holds BOTH the encrypted AAXC and the remuxed M4B on disk at the
# same time, so one long audiobook is ~2GB of scratch. At
# BOOM_BOOKS_LIBERATE_CONCURRENCY=5 that is ~10GB in flight. Left on the
# container's writable layer that is unbounded node ephemeral storage: exceed
# what the node has spare and kubelet evicts pods — potentially OTHER pods on
# talos06, not just this one.
#
# An emptyDir with sizeLimit turns that into a bounded, attributable failure:
# only this pod is affected, and only if it genuinely exceeds the budget.
# 20Gi leaves real headroom over the ~10GB steady state.
#
# THESE TWO NUMBERS ARE COUPLED. Raising the concurrency without raising this
# limit is how you turn "slow" into "evicted mid-download".
#
# emptyDir rather than a PVC on purpose — the scratch is fully re-derivable and
# per-run, so persisting it across restarts would only preserve garbage. The
# service already removes its per-ASIN work directory on every exit path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boomtime
spec:
  template:
    spec:
      containers:
        - name: boomtime
          volumeMounts:
            - name: audiobook-library
              mountPath: /media/audiobooks/liberated
              subPath: audiobooks/liberated
            - name: liberate-work
              mountPath: /tmp/boomtime-liberate
          resources:
            requests:
              # Reserve scratch so the scheduler accounts for it rather than
              # discovering it under pressure.
              ephemeral-storage: 4Gi
            limits:
              ephemeral-storage: 22Gi
      volumes:
        - name: audiobook-library
          persistentVolumeClaim:
            claimName: boomtime-audiobook-library
        - name: liberate-work
          emptyDir:
            sizeLimit: 20Gi
