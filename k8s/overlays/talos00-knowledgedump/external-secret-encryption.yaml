---
# ESO for BOOM_ENCRYPTION_KEY (encryption-at-rest of user secrets like
# imported Wakatime API keys). Separate ExternalSecret so a missing 1P
# field only fails the encryption-key reconciliation, not the whole
# boomtime-secrets set (github-token, remote-write-*).
#
# ── ACTIVATION STEPS ──────────────────────────────────────────────────
# 1. [OPERATOR — the ONLY step left] Copy the value currently live in the
#    cluster into 1Password, do NOT mint a fresh one:
#
#      kubectl -n boomtime get secret boomtime-encryption-key \
#        -o jsonpath='{.data.BOOM_ENCRYPTION_KEY}' | base64 -d
#
#    …and paste it into a password field named `encryption-key` on the
#    1Password item `boomtime` in the vault the `onepassword`
#    ClusterSecretStore points at. It must be exactly 32 random bytes,
#    base64-encoded (44 chars) — `openssl rand -base64 32` shape.
#
#    *** GENERATING A NEW KEY HERE STRANDS EVERY STORED SECRET. ***
#    Rotation is a DB operation, not a Secret edit: see
#    `boomtime rotate-encryption-key --old … --new …` (CLAUDE.md).
#
# 2. DONE (boom-iadc) — this file is listed in kustomization.yaml under
#    `resources:`, so Argo applies it.
#
# 3. Once step 1 lands, ESO reconciles (~1 min) and the
#    `boomtime-encryption-key` Secret it manages takes over the
#    manually-created one bearing the same name. The deployment already
#    references this secret name via envFrom in base/deployment.yaml, so
#    no other change is needed.
#
# 4. When ESO management is confirmed working:
#      kubectl -n boomtime get secret boomtime-encryption-key -o yaml
#    should show the ExternalSecret owner annotations.
# ──────────────────────────────────────────────────────────────────────
#
# UNTIL step 1: the manually-created `boomtime-encryption-key` Secret
# (from `kubectl create secret generic ...`) supplies BOOM_ENCRYPTION_KEY.
# Its key material is NOT backed up anywhere — losing the cluster loses
# access to every user's encrypted Wakatime / Amazon / Hardcover secret,
# and RestoreAll refuses to load a backup containing ciphertext with no
# key present. This ExternalSecret being applied-but-unsynced is the
# LOUD state (Argo shows it degraded); that nag is the point.
#
# ── WHY THE TEMPLATE HAS A LENGTH GUARD ───────────────────────────────
# ESO writing an empty/placeholder value here would silently overwrite the
# only copy of the live key — the exact unrecoverable loss this file
# exists to prevent, caused by the fix for it. `fail` aborts the template,
# ESO reports the error, and the existing Secret is left untouched. 44 is
# len(base64(32 bytes)); the prod-strict boot gate rejects anything else
# anyway, so a short value could only ever produce a CrashLoop.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boomtime-encryption-key
  labels:
    app.kubernetes.io/name: boomtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: boomtime-encryption-key
    creationPolicy: Owner
    template:
      data:
        # Refuse to sync anything that is not a full 32-byte base64 key rather
        # than overwrite the live one with a placeholder. See the header block.
        BOOM_ENCRYPTION_KEY: >-
          {{ if lt (len .encryptionKey) 44 }}{{ fail "1Password boomtime/encryption-key is empty or too short: BOOM_ENCRYPTION_KEY must be 32 random bytes base64-encoded (44 chars). Refusing to overwrite the live boomtime-encryption-key Secret." }}{{ else }}{{ .encryptionKey }}{{ end }}
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: boomtime
        property: encryption-key
