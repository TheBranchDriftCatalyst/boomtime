---
# LAN HTTP: boomtime.talos00 (local LAN only, no TLS).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boomtime-lan
  labels:
    app: boomtime
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Boomtime"
    gethomepage.dev/description: "Coding-time tracker (WakaTime-compatible)"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "wakatime.png"
    gethomepage.dev/href: "http://boomtime.talos00"
    gethomepage.dev/siteMonitor: "http://boomtime.boomtime.svc.cluster.local:8080"
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`boomtime.talos00`)
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: analytics-boomtime # per-subdomain Plausible injection (data-domain=boomtime.knowledgedump.space)
          namespace: traefik
      services:
        - name: boomtime
          port: 8080
---
# External HTTPS: boomtime.knowledgedump.space.
# `tls: {}` uses Traefik's TLSStore default certificate, which is the
# pre-provisioned wildcard `knowledgedump-wildcard-tls` in the traefik ns.
# external-dns annotations create the Cloudflare A/CNAME record.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boomtime
  labels:
    app: boomtime
  annotations:
    external-dns.alpha.kubernetes.io/hostname: boomtime.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    # `!Path(/metrics)` (Traefik v3 NOT operator; cluster runs v3.7 via the
    # talos-homelab helmrelease) keeps the Prometheus registry off the public
    # internet — boom-iadc. GET /metrics is deliberately unauthenticated AND
    # exempt from the rate limiter (shared/server/ratelimit.go) so an
    # in-cluster scrape is zero-friction; with a bare Host() rule that made the
    # full registry — route templates, job kinds + failure counts, DB/Redis
    # pool stats, outbound-host call rates, Go runtime — anonymously readable,
    # and every read an uncapped registry gather.
    #
    # Nothing legitimate loses access: the ServiceMonitor scrapes the
    # `boomtime` Service endpoints directly (servicemonitor.yaml), never
    # through Traefik, and the LAN route below/above still exposes /metrics
    # behind the lan-only middleware for ad-hoc curl. External /metrics now
    # gets a Traefik 404 (no router matches), leaking nothing about whether
    # the endpoint exists.
    #
    # Exact Path, not PathPrefix: the app registers exactly `/metrics`, and a
    # prefix match would also swallow any future /metrics-something route.
    - kind: Rule
      match: Host(`boomtime.knowledgedump.space`) && !Path(`/metrics`)
      middlewares:
        - name: analytics-boomtime # per-subdomain Plausible injection (data-domain=boomtime.knowledgedump.space)
          namespace: traefik
      services:
        - name: boomtime
          port: 8080
  tls: {}
---
# HTTP→HTTPS redirect for the external hostname.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boomtime-http-redirect
  labels:
    app: boomtime
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`boomtime.knowledgedump.space`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: boomtime
          port: 8080
