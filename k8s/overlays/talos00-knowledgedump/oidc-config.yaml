---
# ─────────────────────────────────────────────────────────────────────────────
# PROD OIDC (Authentik) wiring — NON-SECRET keys only.
#
# Strategic-merge patch that ADDs the OIDC env vars onto the base
# `boomtime-config` ConfigMap without disturbing existing keys — same shape as
# llm-config.yaml / label-images-config.yaml. The env var names below are the
# EXACT ones internal/config/config.go parses (see config.Load): they are
# staged so the operator can flip auth on with no re-plumbing.
#
# INERT UNTIL ACTIVATED: this file is NOT in kustomization.yaml's active
# patchesStrategicMerge — it's listed there commented-out. Uncommenting it is
# step 4 of OIDC-PROD-WIRING.md. Until then, next Argo sync = zero change.
#
# The CLIENT_SECRET is deliberately ABSENT here — it is a Secret, delivered by
# oidc-external-secret.yaml from 1Password (BOOM_OIDC_CLIENT_SECRET).
#
# ── Split-horizon decision (READ before setting the issuer) ──────────────────
# In PROD the boomtime pod should reach Authentik at the SAME public issuer URL
# the browser uses. When issuer == authorize == token host, OIDC discovery +
# id_token `issuer` verification pass with NO override — so BOOM_OIDC_AUTHORIZE_URL
# is intentionally OMITTED below (the discovered authorize endpoint is used).
#
# FALLBACK (only if the pod cannot hairpin/NAT-loopback out to the public FQDN
# `auth.knowledgedump.space` — some CNI + external-dns + Cloudflare-proxied
# setups can't reach their own public host from inside the cluster): mirror the
# dev overlay's split-horizon shape —
#   1. keep BOOM_OIDC_ISSUER as the PUBLIC string (the id_token issuer must
#      match what Authentik stamps, which is derived from the public app URL);
#   2. point token/JWKS discovery at the internal service by adding
#      BOOM_OIDC_ISSUER pointing at http://authentik.<ns>.svc:9000/application/o/boomtime/
#      ONLY IF Authentik is configured to emit the public issuer string there;
#   3. set BOOM_OIDC_AUTHORIZE_URL to the PUBLIC authorize endpoint
#      (https://auth.knowledgedump.space/application/o/authorize/) so the
#      browser redirect still lands on a host-reachable URL.
# Prefer the no-override path; only reach for the fallback if a bring-up smoke
# test shows the pod cannot resolve/reach the public Authentik host.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: boomtime-config
  labels:
    app.kubernetes.io/name: boomtime
data:
  # FLIPPED to oidc 2026-08-05. Prereqs verified before the flip: superuser
  # `panda` linked to Authentik user `Panda` (sub-match confirmed against the
  # prod DB), `Panda` ∈ boomtime-admin group → role=admin, OIDC discovery works
  # via the internal Traefik hostAlias (Cloudflare out of the pod path), and all
  # red-team session hardening (gaka-93f.14/.16/.17) is deployed. Password login
  # is now OFF — login is Authentik-only. ROLLBACK: set back to "local" (panda
  # still has a password) and redeploy.
  BOOM_AUTH_PROVIDER: "oidc"

  # CONFIRMED (live Authentik export 2026-08-04): the portal host is
  # `auth.knowledgedump.space` (Traefik IngressRoute in talos-homelab), and the
  # existing litellm provider uses issuer_mode=per_provider, so boomtime's
  # issuer is https://auth.knowledgedump.space/application/o/<slug>/ with slug
  # `boomtime`. TRAILING SLASH MATTERS (config.go: "discovery base, trailing
  # slash required"). Verify post-apply under Applications → Providers →
  # boomtime → "OpenID Configuration Issuer".
  BOOM_OIDC_ISSUER: "https://auth.knowledgedump.space/application/o/boomtime/"

  # TODO(operator): CONFIRM the actual client_id. Authentik generates one when
  # the provider is created; the blueprint (authentik-blueprint-boomtime.yaml)
  # pins it to the literal "boomtime", but verify it matches after apply.
  BOOM_OIDC_CLIENT_ID: "boomtime"

  # Public callback — must exactly match one redirect_uri on the Authentik
  # provider (see authentik-blueprint-boomtime.yaml). Host = prod ingress.
  BOOM_OIDC_REDIRECT_URL: "https://boomtime.knowledgedump.space/auth/callback/oidc"

  # Authentik group name → boomtime role. config.go parses this via
  # parseGroupToRole (env name BOOM_AUTHENTIK_GROUP_TO_ROLE). Groups are created
  # by the blueprint; an identity in none of these falls back to the light tier.
  BOOM_AUTHENTIK_GROUP_TO_ROLE: "boomtime-admin:admin,boomtime-full:full,boomtime-light:light"

  # Do NOT auto-mint boomtime users on first OIDC login in prod — the operator
  # links deliberately during migration. Flip to "true" later if self-serve
  # Authentik signups should provision accounts.
  BOOM_OIDC_AUTOPROVISION: "false"

  # Keep autolink-by-email OFF. Linking purely on a matching email address is an
  # account-takeover footgun (an attacker who controls an Authentik identity with
  # a victim's email could seize the local account). Tracked HIGH finding
  # gaka-93f.12 — autolink is being REMOVED; do not enable it here.
  BOOM_OIDC_AUTOLINK_EMAIL: "false"
