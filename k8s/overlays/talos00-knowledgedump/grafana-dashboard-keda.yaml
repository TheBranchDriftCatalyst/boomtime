---
# GrafanaDashboard CR: "boomtime — KEDA Autoscaling". Same pattern as
# grafana-dashboard-worker-queue.yaml (grafana-operator watches all namespaces
# — namespaceScope:false — so this reconciles into the shared Grafana from the
# boomtime namespace; folderRef ops-app slots it into "Ops > App"). Needs the
# keda-servicemonitor.yaml scrape (this overlay) for data. JSON at
# grafana/keda-dashboard.json, packaged by the kustomization configMapGenerator
# as dashboard-boomtime-keda. uid "boomtime-keda-scaling" is stable (in the JSON).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: boomtime-keda-scaling
  namespace: boomtime
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: boomtime
spec:
  folderRef: ops-app
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-boomtime-keda
    key: keda-dashboard.json
