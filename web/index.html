<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#ef4444" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Self-hosted WakaTime-compatible coding activity dashboard with Apple Watch health overlay." />
    <!--
      Chakra Petch for the Arasaka dossier section headers (gaka-k2p).
      Compressed geometric that reads cyberpunk-native without the
      Space-Grotesk cliché. Only referenced by .theme-arasaka scopes; every
      other theme falls back to the existing JetBrains Mono stack, so this
      preconnect + stylesheet is cheap even for non-Arasaka users. Weights
      500/600/700 mirror the CSS `font-weight` demands.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Boomtime</title>
    <!--
      No-flash-of-wrong-theme <script> is injected automatically by
      `catalystPlugin({ noFlash: { legacyStorageKey: "boomtime-theme" } })`
      at build/dev time. See web/vite.config.ts.
    -->
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
