# Dev stack. `docker compose up` brings up the DB, the Go server (live-reload
# via air) and the Vite dev server — all dockerized. For host-based dev instead,
# use `task db:up` (only the db) + `task dev` (air + vite on the host).
services:
  db:
    container_name: boomtime_db
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BOOM_DB_NAME:-boomtime}
      POSTGRES_USER: ${BOOM_DB_USER:-test}
      POSTGRES_PASSWORD: ${BOOM_DB_PASS:-test}
    ports:
      - "${BOOM_DB_PORT:-5432}:5432"
    volumes:
      - boomtime_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOM_DB_USER:-test} -d ${BOOM_DB_NAME:-boomtime}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Go API server with live reload (air). Source is bind-mounted.
  app:
    container_name: boomtime_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      BOOM_DB_HOST: db          # reach the db container, not localhost
      BOOM_DB_PORT: 5432
      BOOM_PORT: 8080
    volumes:
      - .:/src                  # live source
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"

  # Vite dev server with HMR; proxies /api,/auth,/badge,/import to the app.
  web:
    container_name: boomtime_web
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /src/web
    depends_on: [app]
    environment:
      BOOM_BACKEND_URL: http://app:8080   # vite proxy target inside the network
    # yarn, NOT npm (boom-iadc). web/ is a yarn-1 tree with a committed
    # yarn.lock, and both Dockerfiles install with exactly this line. `npm
    # install` ignores yarn.lock, resolves its own semver-compatible versions,
    # and writes a stray package-lock.json into the bind-mounted repo — so the
    # compose dev server silently runs different FE deps than CI and prod
    # build, which is the "passes locally, fails the Docker web stage" drift
    # this project has already been bitten by. --frozen-lockfile makes a
    # lockfile/package.json mismatch a hard error instead of a silent
    # re-resolve; --ignore-engines matches the Dockerfiles (a transitive dep
    # declares node>=24, nothing here needs node 24 semantics).
    # node:22-alpine ships yarn 1.x, so no extra install step.
    command: sh -c "yarn install --frozen-lockfile --ignore-engines && yarn dev --host 0.0.0.0"
    volumes:
      - .:/src
      - web_node_modules:/src/web/node_modules
    ports:
      - "5173:5173"

volumes:
  boomtime_db_data: {}
  go_mod_cache: {}
  go_build_cache: {}
  web_node_modules: {}
